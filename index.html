<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved appearance before the stylesheet paints the page.
      try {
        if (localStorage.getItem("gafu-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch { /* Storage can be unavailable in a restricted browser. */ }
    </script>
    <title>Gafu V2 diagnostics</title>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
