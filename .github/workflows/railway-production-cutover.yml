name: Railway Production Cutover

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type STAGE_GAFU_V2_WITH_PRIVATE_DATA
        required: true
        type: string

permissions:
  contents: read

jobs:
  cutover:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'STAGE_GAFU_V2_WITH_PRIVATE_DATA'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      # Workspace API token: the project token reads production but its
      # variable writes are rejected as Unauthorized (cutover run 34333435480).
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      EXPECTED_PROJECT_ID: 480aadb5-09cc-4cdc-a463-cfd42ee888e4
      EXPECTED_ENVIRONMENT_ID: 99c4c48f-bd71-401e-9390-4e2134fa2660
      EXPECTED_V1_SERVICE_ID: 1d3e6245-5395-4fa1-97e6-f1e7883dac34
      EXPECTED_V2_SERVICE_ID: 8936ec29-1110-4fd6-beec-6afb7e3c68e5
      EXPECTED_V2_VOLUME_ID: 22cfeb13-64d2-44a9-bbae-5e8447a8d704
      ACCEPTED_RECONCILIATION_SHA256: 8fbee13560ce98e67509877da9648025f3af74d197496e265fab007ed14620f2
      IMPORT_KEY: v1-production-cutover-2026-09-09
    steps:
      - name: Check out V2
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the pinned private-baseline source
        uses: actions/checkout@v4
        with:
          repository: garthtrickett/gafu
          ref: def80a2ffebf47c71c20454933e5bf593814facc
          path: v1-source
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install pinned tools
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          npm install --global @railway/cli@5.41.2

      - name: Validate the private inputs without printing them
        env:
          GAFU_V1_BEARER_TOKEN: ${{ secrets.GAFU_V1_BEARER_TOKEN }}
          GAFU_ACCESS_PASSWORD: ${{ secrets.GAFU_ACCESS_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${RAILWAY_API_TOKEN:-}"
          test -n "${GAFU_V1_BEARER_TOKEN:-}"
          test -n "${OPENAI_API_KEY:-}"
          test "$(printf %s "$GAFU_ACCESS_PASSWORD" | wc -c)" -ge 16
          test "$(printf %s "$GAFU_ACCESS_PASSWORD" | wc -c)" -le 512

      - name: Reconcile a fresh read-only V1 snapshot
        env:
          GAFU_V1_BEARER_TOKEN: ${{ secrets.GAFU_V1_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/v1-production-snapshot.json"
          report="$RUNNER_TEMP/v1-production-dry-run.json"
          bun run migration:v1:fetch -- \
            --origin https://gafu-production.up.railway.app \
            --output "$snapshot"
          bun run migration:v1 -- \
            --source "$snapshot" \
            --database "$RUNNER_TEMP/private-volume/gafu-v2.sqlite" \
            --dry-run \
            --report "$report"

          fingerprint="$({
            jq -Sc '{
              contractVersion,
              counts,
              preferences: {
                newCardsPerDay: .preferences.newCardsPerDay,
                timeZone: .preferences.timeZone,
                reason: .preferences.reason
              },
              items: (
                .items
                | map({
                    sourceId,
                    kind,
                    disposition,
                    reason,
                    desiredState,
                    schedule,
                    recordDigest
                  })
                | sort_by(.sourceId)
              )
            }' "$report"
          } | sha256sum | cut -d ' ' -f 1)"
          if [ "$fingerprint" != "$ACCEPTED_RECONCILIATION_SHA256" ]; then
            echo "::error::Fresh V1 reconciliation differs from the owner-accepted report. No Railway state was changed."
            jq '{
              counts,
              preferences: {
                newCardsPerDay: .preferences.newCardsPerDay,
                timeZone: .preferences.timeZone,
                reason: .preferences.reason
              },
              reasons: (.items | group_by(.reason) | map({reason: .[0].reason, count: length}))
            }' "$report"
            echo "Observed reconciliation fingerprint: $fingerprint"
            exit 1
          fi
          jq -e '
            .counts == {input: 296, mapped: 294, merged: 0, skipped: 0, quarantined: 2}
            and .preferences.newCardsPerDay == 3
            and .preferences.timeZone == null
            and .preferences.reason == "timeZoneInvalid"
          ' "$report" >/dev/null
          echo "Fresh V1 reconciliation matches the accepted 296-row legacy projection."

      - name: Build and verify the private V2 data files
        env:
          GAFU_ACCESS_PASSWORD: ${{ secrets.GAFU_ACCESS_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          private_root="$RUNNER_TEMP/private-volume"
          database="$private_root/gafu-v2.sqlite"
          seed="$private_root/kaishi-1.5k.local.json"
          snapshot="$RUNNER_TEMP/v1-production-snapshot.json"
          applied_report="$RUNNER_TEMP/v1-production-applied.json"
          known_receipt="$RUNNER_TEMP/v1-production-known.json"
          mkdir -m 700 -p "$private_root"

          test "$(sha256sum v1-source/src/lib/client/stores/kaishiPool.json | cut -d ' ' -f 1)" = \
            "51f02ad7a1785653313dc74a06ad55a3b0b7b77a2394ab6fa21a8d7c7efbab21"
          bun run kaishi:install -- \
            --source v1-source/src/lib/client/stores/kaishiPool.json \
            --output "$seed"
          jq -e '
            .schema == "gafu-known-word-seed-v1"
            and .id == "kaishi-1.5k"
            and .version == "sha256:82799c36282b21a9828e62756ebb36b365d1d64a346f8fba9edf0f0597332d25"
            and .sourceEntryCount == 1500
            and (.entries | length) == 1437
          ' "$seed" >/dev/null

          bun run migration:v1 -- \
            --source "$snapshot" \
            --database "$database" \
            --apply \
            --import-key "$IMPORT_KEY" \
            --report "$applied_report"
          bun run migration:v1:mark-known -- \
            --database "$database" \
            --import-key "$IMPORT_KEY" \
            --confirm-imported-known > "$known_receipt"
          jq -e '
            .sourceItems == 296
            and .uniqueCards == 296
            and .knownCardsAfter == 296
            and ([.statesBefore[]] | add) == 296
            and .schedulesPreserved >= 0
            and .reviewsPreserved == 0
            and .quarantinesPreserved == 2
          ' "$known_receipt" >/dev/null

          server_log="$RUNNER_TEMP/local-production-startup.log"
          GAFU_PUBLIC_DEPLOYMENT=1 \
          GAFU_BOOTSTRAP_ONLY=0 \
          GAFU_DATABASE_PATH="$database" \
          GAFU_KAISHI_SEED_PATH="$seed" \
          GAFU_OPENAI_MODEL=gpt-5.6-luna \
          RAILWAY_VOLUME_MOUNT_PATH="$private_root" \
          PORT=42070 \
            bun run start > "$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill -TERM "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          healthy=0
          for _ in $(seq 1 120); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:42070/healthz >/dev/null; then
              healthy=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$healthy" != 1 ]; then
            sed -n '1,120p' "$server_log"
            exit 1
          fi
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 http://127.0.0.1:42070/)" = 303
          GAFU_VERIFY_ORIGIN=http://127.0.0.1:42070 bun -e '
            const login = await fetch(`${process.env.GAFU_VERIFY_ORIGIN}/auth/login`, {
              method: "POST",
              redirect: "manual",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({ password: process.env.GAFU_ACCESS_PASSWORD ?? "" })
            });
            if (login.status !== 303) throw new Error("private login failed");
            const cookie = (login.headers.get("set-cookie") ?? "").split(";")[0];
            const response = await fetch(`${process.env.GAFU_VERIFY_ORIGIN}/api/study`, { headers: { cookie } });
            const study = await response.json();
            if (response.status !== 200 || study.status?.knownCount !== 296 || study.knowledge?.baseline?.enabledCount !== 1437) {
              throw new Error("private Study verification failed");
            }
          '
          cleanup
          trap - EXIT

          bun run backup:inspect -- "$database" > "$RUNNER_TEMP/v2-backup-inspection.json"
          bun run health -- "$database" > "$RUNNER_TEMP/v2-health.json"
          jq -e '
            .status == "healthy"
            and .studySchemaVersion == 6
            and .preparationSchemaVersion == 1
            and .integrity == "ok"
            and .foreignKeys == "ok"
            and .cards == {
              grammar: 296,
              vocabulary: 0,
              staged: 0,
              active: 0,
              known: 296,
              suspended: 0
            }
          ' "$RUNNER_TEMP/v2-health.json" >/dev/null
          chmod 600 "$database" "$seed"
          echo "Private V2 data passed migration, baseline, startup, backup, and health checks."

      - name: Guard the exact untouched Railway boundary
        run: |
          set -euo pipefail
          # Workspace tokens carry no implicit project link (unlike project
          # tokens), so link the exact target first. Every assertion below
          # re-verifies the linked project, environment, services, and volume
          # by ID, so a wrong link fails closed here before anything mutates.
          railway link \
            --project "$EXPECTED_PROJECT_ID" \
            --environment "$EXPECTED_ENVIRONMENT_ID" \
            --service "$EXPECTED_V2_SERVICE_ID"
          echo "guard: linked"
          status="$(railway status --json 2>"$RUNNER_TEMP/status.err" || { cat "$RUNNER_TEMP/status.err"; exit 1; })"
          echo "guard: status bytes ${#status}"
          test "$(jq -r '.id' <<<"$status")" = "$EXPECTED_PROJECT_ID"
          echo "guard: project ok"
          test "$(jq -r '.id' <<<"$status")" = "$EXPECTED_PROJECT_ID"
          jq -e --arg environment_id "$EXPECTED_ENVIRONMENT_ID" '
            any(.environments.edges[]; .node.id == $environment_id and .node.name == "production" and .node.canAccess)
          ' <<<"$status" >/dev/null
          echo "guard: environment ok"
          jq -e --arg environment_id "$EXPECTED_ENVIRONMENT_ID" --arg service_id "$EXPECTED_V1_SERVICE_ID" '
            [
              .environments.edges[].node
              | select(.id == $environment_id)
              | .serviceInstances.edges[].node
              | select(.serviceId == $service_id)
            ] as $instances
            | ($instances | length) == 1
              and $instances[0].source.repo == "garthtrickett/gafu"
          ' <<<"$status" >/dev/null
          echo "guard: v1 service ok"
          # The V2 service is either untouched (pristine) or exactly where a
          # previous gated run stopped: source connected to this repository
          # with no data uploaded yet. The status view exposes only repo and
          # image (no branch), so the bootstrap step below always reconnects
          # branch main authoritatively. Anything else fails closed here
          # before any mutation. The volume-emptiness and domain assertions
          # below apply to both states, so no data can be overwritten.
          v2_boundary="$(jq -r --arg environment_id "$EXPECTED_ENVIRONMENT_ID" --arg service_id "$EXPECTED_V2_SERVICE_ID" '
            [
              .environments.edges[].node
              | select(.id == $environment_id)
              | .serviceInstances.edges[].node
              | select(.serviceId == $service_id)
            ] | if length != 1 then "invalid"
              elif .[0].source.repo == null
                and .[0].source.image == null
                and .[0].latestDeployment == null
                and (.[0].activeDeployments | length) == 0 then "pristine"
              elif .[0].source.repo == "garthtrickett/gafu-v2"
                and .[0].source.image == null then "resumed"
              else "invalid" end
          ' <<<"$status")"
          echo "V2 boundary state: $v2_boundary"
          if [ "$v2_boundary" != pristine ] && [ "$v2_boundary" != resumed ]; then
            echo "V2 source object:"
            jq -c --arg environment_id "$EXPECTED_ENVIRONMENT_ID" --arg service_id "$EXPECTED_V2_SERVICE_ID" '
              [.environments.edges[].node
               | select(.id == $environment_id)
               | .serviceInstances.edges[].node
               | select(.serviceId == $service_id)][0].source
            ' <<<"$status"
            exit 1
          fi
          echo "BOUNDARY_STATE=$v2_boundary" >> "$GITHUB_ENV"
          if [ "$v2_boundary" = resumed ]; then
            echo "Resuming after a previous gated stop; no data has been uploaded yet."
          fi

          volumes="$(railway volume \
            --project "$EXPECTED_PROJECT_ID" \
            --environment "$EXPECTED_ENVIRONMENT_ID" \
            --service "$EXPECTED_V2_SERVICE_ID" \
            list --json)"
          jq -e --arg volume_id "$EXPECTED_V2_VOLUME_ID" '
            [.volumes[] | select(.serviceName == "gafu-v2")] as $volumes
            | ($volumes | length) == 1
              and $volumes[0].id == $volume_id
              and $volumes[0].mountPath == "/data"
              and $volumes[0].status == "Ready"
          ' <<<"$volumes" >/dev/null
          echo "guard: volume ok"
          v2_domains="$(railway domain list \
            --project "$EXPECTED_PROJECT_ID" \
            --environment "$EXPECTED_ENVIRONMENT_ID" \
            --service "$EXPECTED_V2_SERVICE_ID" \
            --json | jq -r '.domains[]? // empty')"
          if [ "$v2_boundary" = pristine ]; then
            test -z "$v2_domains"
          else
            # Resumed: normally still empty; a Railway-generated default
            # *.up.railway.app domain is also acceptable. Custom domains
            # fail closed here.
            ! printf '%s\n' "$v2_domains" | grep -vE '\.up\.railway\.app$' | grep -q .
          fi
          echo "V2 boundary confirmed ($v2_boundary); V1 remains the active service."

      - name: Start the inaccessible bootstrap deployment
        env:
          GAFU_ACCESS_PASSWORD: ${{ secrets.GAFU_ACCESS_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          printf %s "$GAFU_ACCESS_PASSWORD" | railway variable set GAFU_ACCESS_PASSWORD \
            --stdin --skip-deploys --json \
            --project "$EXPECTED_PROJECT_ID" \
            --environment "$EXPECTED_ENVIRONMENT_ID" \
            --service "$EXPECTED_V2_SERVICE_ID" >/dev/null
          printf %s "$OPENAI_API_KEY" | railway variable set OPENAI_API_KEY \
            --stdin --skip-deploys --json \
            --project "$EXPECTED_PROJECT_ID" \
            --environment "$EXPECTED_ENVIRONMENT_ID" \
            --service "$EXPECTED_V2_SERVICE_ID" >/dev/null
          railway variable set \
            GAFU_PUBLIC_DEPLOYMENT=1 \
            GAFU_BOOTSTRAP_ONLY=1 \
            GAFU_DATABASE_PATH=/data/gafu-v2.sqlite \
            GAFU_KAISHI_SEED_PATH=/data/kaishi-1.5k.local.json \
            GAFU_OPENAI_MODEL=gpt-5.6-luna \
            --skip-deploys --json \
            --project "$EXPECTED_PROJECT_ID" \
            --environment "$EXPECTED_ENVIRONMENT_ID" \
            --service "$EXPECTED_V2_SERVICE_ID" >/dev/null

          railway api \
            'mutation ConfigureGafuV2($serviceId: String!, $environmentId: String, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }' \
            --raw-var serviceId="$EXPECTED_V2_SERVICE_ID" \
            --raw-var environmentId="$EXPECTED_ENVIRONMENT_ID" \
            --var 'input={"healthcheckPath":"/healthz","healthcheckTimeout":300,"numReplicas":1,"restartPolicyType":"ON_FAILURE","restartPolicyMaxRetries":3}' \
            --compact | jq -e '.data | has("serviceInstanceUpdate")' >/dev/null
          # The source is (re)connected on every run: on pristine it is the
          # first connection, on resume it re-pins branch main
          # authoritatively (the status view cannot report the branch).
          # A same-target reconnect is idempotent; any real failure here
          # fails the run visibly before the deployment wait below.
          railway service source connect \
            --repo garthtrickett/gafu-v2 \
            --branch main \
            --project "$EXPECTED_PROJECT_ID" \
            --environment "$EXPECTED_ENVIRONMENT_ID" \
            --service "$EXPECTED_V2_SERVICE_ID" \
            --json >/dev/null

          for _ in $(seq 1 120); do
            deployment="$(railway service status \
              --project "$EXPECTED_PROJECT_ID" \
              --environment "$EXPECTED_ENVIRONMENT_ID" \
              --service "$EXPECTED_V2_SERVICE_ID" --json)"
            deployment_id="$(jq -r '.deploymentId // empty' <<<"$deployment")"
            deployment_status="$(jq -r '.status // empty' <<<"$deployment")"
            if [ "$deployment_status" = SUCCESS ] && [ "$(jq -r '.stopped' <<<"$deployment")" = false ]; then
              echo "BOOTSTRAP_DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"
              echo "Bootstrap-only deployment is active."
              exit 0
            fi
            if [ "$deployment_status" = FAILED ] || [ "$deployment_status" = CRASHED ]; then
              echo "::error::Bootstrap deployment failed: $deployment_id $deployment_status"
              exit 1
            fi
            sleep 5
          done
          echo "::error::Bootstrap deployment did not become active within ten minutes."
          exit 1

      - name: Provision an ephemeral volume-access SSH key
        run: |
          set -euo pipefail
          # Volume file operations travel over SSH. Token auth carries no SSH
          # identity, so mint a single-use keypair for this run only. The
          # 5.41.2 CLI only discovers keys in the agent or ~/.ssh, so the
          # keypair lives there rather than RUNNER_TEMP. The workspace token
          # auto-scopes registration to the workspace.
          key_path="$HOME/.ssh/gafu-v2-cutover-$GITHUB_RUN_ID"
          mkdir -p "$HOME/.ssh"
          ssh-keygen -t ed25519 -N '' -f "$key_path" -C "gafu-v2-cutover-$GITHUB_RUN_ID" -q
          railway ssh keys add -k "$key_path.pub" -n "gafu-v2-cutover-$GITHUB_RUN_ID" >/dev/null
          # Volume file transport offers agent keys; a custom-named file in
          # ~/.ssh is not tried on its own. The agent lives on this runner,
          # so later steps reuse it through the persisted socket.
          eval "$(ssh-agent -s)" >/dev/null
          ssh-add "$key_path" >/dev/null
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"
          echo "CUTOVER_SSH_KEY=gafu-v2-cutover-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "Ephemeral SSH key registered for volume access."

      - name: Verify the empty volume and upload only the private data files
        run: |
          set -euo pipefail
          private_root="$RUNNER_TEMP/private-volume"
          # Key registration can lag a few seconds behind the add call, and
          # the SSH transport flakes occasionally; retry a read-only list
          # before concluding anything. A still-empty listing afterward fails
          # closed with the transport's own error attached.
          listing=""
          for attempt in 1 2 3; do
            if listing="$(railway volume \
              --project "$EXPECTED_PROJECT_ID" \
              --environment "$EXPECTED_ENVIRONMENT_ID" \
              --service "$EXPECTED_V2_SERVICE_ID" \
              files --volume "$EXPECTED_V2_VOLUME_ID" list / --json 2>"$RUNNER_TEMP/volume-list.err")"; then
              break
            fi
            echo "Volume list attempt $attempt failed; retrying."
            sleep 15
          done
          if [ -z "$listing" ]; then
            echo "::error::Volume list failed:"
            cat "$RUNNER_TEMP/volume-list.err"
            exit 1
          fi
          jq -e '.files | length == 0' <<<"$listing" >/dev/null

          railway volume \
            --project "$EXPECTED_PROJECT_ID" \
            --environment "$EXPECTED_ENVIRONMENT_ID" \
            --service "$EXPECTED_V2_SERVICE_ID" \
            files --volume "$EXPECTED_V2_VOLUME_ID" \
            upload "$private_root/gafu-v2.sqlite" /gafu-v2.sqlite --json >/dev/null
          railway volume \
            --project "$EXPECTED_PROJECT_ID" \
            --environment "$EXPECTED_ENVIRONMENT_ID" \
            --service "$EXPECTED_V2_SERVICE_ID" \
            files --volume "$EXPECTED_V2_VOLUME_ID" \
            upload "$private_root/kaishi-1.5k.local.json" /kaishi-1.5k.local.json --json >/dev/null

          listing="$(railway volume \
            --project "$EXPECTED_PROJECT_ID" \
            --environment "$EXPECTED_ENVIRONMENT_ID" \
            --service "$EXPECTED_V2_SERVICE_ID" \
            files --volume "$EXPECTED_V2_VOLUME_ID" list / --json)"
          database_size="$(stat -c %s "$private_root/gafu-v2.sqlite")"
          seed_size="$(stat -c %s "$private_root/kaishi-1.5k.local.json")"
          jq -e --argjson database_size "$database_size" --argjson seed_size "$seed_size" '
            (.files | length) == 2
            and any(.files[]; .name == "gafu-v2.sqlite" and .type == "file" and .size == $database_size)
            and any(.files[]; .name == "kaishi-1.5k.local.json" and .type == "file" and .size == $seed_size)
          ' <<<"$listing" >/dev/null
          echo "The stopped V2 boundary now contains exactly the verified database and Kaishi manifest."

      - name: Activate and verify the private V2 service
        env:
          GAFU_ACCESS_PASSWORD: ${{ secrets.GAFU_ACCESS_PASSWORD }}
        run: |
          set -euo pipefail
          railway variable set GAFU_BOOTSTRAP_ONLY=0 \
            --json \
            --project "$EXPECTED_PROJECT_ID" \
            --environment "$EXPECTED_ENVIRONMENT_ID" \
            --service "$EXPECTED_V2_SERVICE_ID" >/dev/null

          final_deployment_id=""
          for _ in $(seq 1 120); do
            deployment="$(railway service status \
              --project "$EXPECTED_PROJECT_ID" \
              --environment "$EXPECTED_ENVIRONMENT_ID" \
              --service "$EXPECTED_V2_SERVICE_ID" --json)"
            deployment_id="$(jq -r '.deploymentId // empty' <<<"$deployment")"
            deployment_status="$(jq -r '.status // empty' <<<"$deployment")"
            if [ "$deployment_id" != "$BOOTSTRAP_DEPLOYMENT_ID" ] && \
               [ "$deployment_status" = SUCCESS ] && \
               [ "$(jq -r '.stopped' <<<"$deployment")" = false ]; then
              final_deployment_id="$deployment_id"
              break
            fi
            if [ "$deployment_id" != "$BOOTSTRAP_DEPLOYMENT_ID" ] && \
               { [ "$deployment_status" = FAILED ] || [ "$deployment_status" = CRASHED ]; }; then
              echo "::error::Final V2 deployment failed: $deployment_id $deployment_status"
              exit 1
            fi
            sleep 5
          done
          test -n "$final_deployment_id"

          domain_json="$(railway domain \
            --project "$EXPECTED_PROJECT_ID" \
            --environment "$EXPECTED_ENVIRONMENT_ID" \
            --service "$EXPECTED_V2_SERVICE_ID" --json)"
          v2_origin="$(jq -r '.domain // .domains[0] // empty' <<<"$domain_json")"
          test "${v2_origin#https://}" != "$v2_origin"
          test "$(curl --silent --fail --output /dev/null --write-out '%{http_code}' --retry 20 --retry-all-errors --retry-delay 3 "$v2_origin/healthz")" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "$v2_origin/")" = 303
          GAFU_VERIFY_ORIGIN="$v2_origin" bun -e '
            const login = await fetch(`${process.env.GAFU_VERIFY_ORIGIN}/auth/login`, {
              method: "POST",
              redirect: "manual",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({ password: process.env.GAFU_ACCESS_PASSWORD ?? "" })
            });
            if (login.status !== 303) throw new Error("deployed private login failed");
            const cookie = (login.headers.get("set-cookie") ?? "").split(";")[0];
            const response = await fetch(`${process.env.GAFU_VERIFY_ORIGIN}/api/study`, { headers: { cookie } });
            const study = await response.json();
            if (response.status !== 200 || study.status?.knownCount !== 296 || study.knowledge?.baseline?.enabledCount !== 1437) {
              throw new Error("deployed private Study verification failed");
            }
          '

          {
            echo "### Private Gafu V2 is ready for owner acceptance"
            echo
            echo "- URL: $v2_origin"
            echo "- Deployment: $final_deployment_id"
            echo "- Imported Cards known: 296"
            echo "- Kaishi baseline entries: 1437"
            echo "- Existing V1 domain: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Private Gafu V2 is active at $v2_origin; V1 remains unchanged."

      - name: Remove the ephemeral volume-access SSH key
        if: always()
        run: |
          set -euo pipefail
          # Hygiene only: the key is single-use per run. The 5.41.2 CLI prints
          # a human table here, so the fingerprint is matched by pattern
          # rather than parsed JSON. Removal failure (for example a 2FA
          # challenge) warns instead of failing the run; a leftover key is
          # named by run ID for manual removal.
          key_ref=""
          if [ -n "${CUTOVER_SSH_KEY:-}" ]; then
            key_line="$(railway ssh keys list 2>/dev/null | grep -F "$CUTOVER_SSH_KEY" || true)"
            key_ref="$(printf '%s' "$key_line" | grep -oE 'SHA256:[^ ]+|([0-9a-f]{2}:){15}[0-9a-f]{2}' | head -1 || true)"
          fi
          if [ -n "$key_ref" ]; then
            railway ssh keys remove "$key_ref" >/dev/null || echo "::warning::Ephemeral SSH key ${CUTOVER_SSH_KEY:-unknown} needs manual removal."
          else
            echo "No ephemeral SSH key to remove."
          fi
          rm -f "$HOME/.ssh/gafu-v2-cutover-$GITHUB_RUN_ID" "$HOME/.ssh/gafu-v2-cutover-$GITHUB_RUN_ID.pub"
