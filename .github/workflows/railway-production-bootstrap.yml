name: Railway Production Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      EXPECTED_PROJECT_ID: 480aadb5-09cc-4cdc-a463-cfd42ee888e4
      EXPECTED_ENVIRONMENT_ID: 99c4c48f-bd71-401e-9390-4e2134fa2660
      EXPECTED_V2_SERVICE_ID: 8936ec29-1110-4fd6-beec-6afb7e3c68e5
    steps:
      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.41.2

      - name: Guard the exact empty V2 service
        run: |
          set -euo pipefail
          status="$(railway status --json)"

          test "$(jq -r '.id' <<<"$status")" = "$EXPECTED_PROJECT_ID"
          jq -e --arg environment_id "$EXPECTED_ENVIRONMENT_ID" '
            any(.environments.edges[]; .node.id == $environment_id and .node.name == "production" and .node.canAccess)
          ' <<<"$status" >/dev/null
          jq -e 'any(.services.edges[]; .node.name == "gafu")' <<<"$status" >/dev/null

          jq -e --arg service_id "$EXPECTED_V2_SERVICE_ID" '
            [.services.edges[] | select(.node.name == "gafu-v2")] as $services
            | ($services | length) == 1
              and $services[0].node.id == $service_id
          ' <<<"$status" >/dev/null

          jq -e --arg environment_id "$EXPECTED_ENVIRONMENT_ID" --arg service_id "$EXPECTED_V2_SERVICE_ID" '
            [
              .environments.edges[].node
              | select(.id == $environment_id)
              | .serviceInstances.edges[].node
              | select(.serviceId == $service_id)
            ] as $instances
            | ($instances | length) == 1
              and $instances[0].source.repo == null
              and $instances[0].source.image == null
              and $instances[0].latestDeployment == null
              and ($instances[0].activeDeployments | length) == 0
          ' <<<"$status" >/dev/null

          jq -e --arg environment_id "$EXPECTED_ENVIRONMENT_ID" --arg service_id "$EXPECTED_V2_SERVICE_ID" '
            [
              .environments.edges[].node
              | select(.id == $environment_id)
              | .volumeInstances.edges[].node
              | select(.serviceId == $service_id)
            ]
            | length == 0
          ' <<<"$status" >/dev/null

      - name: Complete the stopped V2 storage boundary
        run: |
          set -euo pipefail
          railway volume \
            --project "$EXPECTED_PROJECT_ID" \
            --environment "$EXPECTED_ENVIRONMENT_ID" \
            --service "$EXPECTED_V2_SERVICE_ID" \
            add \
            --mount-path /data \
            --json
          railway variable set \
            GAFU_PUBLIC_DEPLOYMENT=1 \
            GAFU_DATABASE_PATH=/data/gafu-v2.sqlite \
            GAFU_KAISHI_SEED_PATH=/data/kaishi-1.5k.local.json \
            GAFU_OPENAI_MODEL=gpt-5.6-luna \
            --project "$EXPECTED_PROJECT_ID" \
            --environment "$EXPECTED_ENVIRONMENT_ID" \
            --service gafu-v2 \
            --skip-deploys \
            --json

      - name: Report only the new resource boundary
        run: |
          set -euo pipefail
          railway service list --json | jq '[.[] | select(.name == "gafu-v2")]'
          railway volume \
            --project "$EXPECTED_PROJECT_ID" \
            --environment "$EXPECTED_ENVIRONMENT_ID" \
            --service "$EXPECTED_V2_SERVICE_ID" \
            list \
            --json | jq '{
            environment,
            project,
            volumes: [.volumes[] | select(.serviceName == "gafu-v2")]
          }'
